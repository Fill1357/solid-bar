name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse plugin metadata
        id: plugin
        run: |
          id=$(grep -oP '(?<=__id__ = ")[^"]+' exteragram_plugin_template.py)
          name=$(grep -oP '(?<=__name__ = ")[^"]+' exteragram_plugin_template.py)
          echo "id=$id" >> $GITHUB_OUTPUT
          echo "name=$name" >> $GITHUB_OUTPUT

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Point Gradle to runner Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Prepare Telegram Stub Jar
        run: |
          mkdir -p libs
          echo "Creating fallback stub telegram.jar..."
          mkdir -p org/telegram/ui/ActionBar
          echo "package org.telegram.ui.ActionBar; public class ActionBar {}" > org/telegram/ui/ActionBar/ActionBar.java
          javac org/telegram/ui/ActionBar/ActionBar.java
          jar cf libs/Telegram.stripped.jar org/telegram/ui/ActionBar/ActionBar.class
          rm -rf org

      - name: Build and Embed DEX into Python
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
          VERSION: ${{ inputs.version }}
          PLUGIN_ID: ${{ steps.plugin.outputs.id }}
        run: |
          chmod +x gradlew
          ./gradlew :buildDexRelease -Dorg.gradle.daemon=false
          
          python3 << 'PYEOF'
          import base64, lzma
          
          with open('dist/dex/release/classes.dex', 'rb') as f:
              dex_data = f.read()
          
          compressed = lzma.compress(dex_data)
          b64_data = base64.b64encode(compressed).decode('utf-8')
          lines = ['# ' + b64_data[i:i+76] for i in range(0, len(b64_data), 76)]
          dex_text = '\n'.join(lines)
          
          with open('exteragram_plugin_template.py', 'r', encoding='utf-8') as f:
              content = f.read()
          
          start_marker = '# === EMDEDDED DEX BEGIN ==='
          end_marker = '# === EMDEDDED DEX END ==='
          
          start_idx = content.find(start_marker)
          end_idx = content.find(end_marker)
          
          if start_idx != -1 and end_idx != -1:
              new_content = content[:start_idx + len(start_marker)] + '\n' + dex_text + '\n' + content[end_idx:]
              with open('exteragram_plugin_template.py', 'w', encoding='utf-8') as f:
                  f.write(new_content)
              print('DEX embedded successfully')
          else:
              print('ERROR: markers not found')
              exit(1)
          PYEOF
          
          release_dir="$RUNNER_TEMP/release"
          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          
          cp exteragram_plugin_template.py "$release_dir/exteragram-plugin-template.py"
          
          cd "$release_dir"
          zip -j "${PLUGIN_ID}.plugin" exteragram-plugin-template.py
          cd -

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ runner.temp }}/release/${{ steps.plugin.outputs.id }}.plugin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Release v${{ inputs.version }} — ${{ steps.plugin.outputs.name }}
          files: |
            ${{ runner.temp }}/release/${{ steps.plugin.outputs.id }}.plugin
          draft: false
          prerelease: false
