name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse plugin metadata
        id: plugin
        run: |
          id=$(python3 -c "import exteragram_plugin_template as p; print(p.__id__)")
          name=$(python3 -c "import exteragram_plugin_template as p; print(p.__name__)")
          echo "id=$id" >> $GITHUB_OUTPUT
          echo "name=$name" >> $GITHUB_OUTPUT

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Point Gradle to runner Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Prepare Telegram Stub Jar
        run: |
          mkdir -p libs
          echo "Creating fallback stub telegram.jar..."
          mkdir -p org/telegram/ui/ActionBar
          echo "package org.telegram.ui.ActionBar; public class ActionBar {}" > org/telegram/ui/ActionBar/ActionBar.java
          javac org/telegram/ui/ActionBar/ActionBar.java
          jar cf libs/Telegram.stripped.jar org/telegram/ui/ActionBar/ActionBar.class
          rm -rf org
      - name: Build the release plugin
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
          VERSION: ${{ inputs.version }}
          PLUGIN_ID: ${{ steps.plugin.outputs.id }}
        run: |
          chmod +x gradlew
          release_dir="$RUNNER_TEMP/release"
          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          ./gradlew :buildDexRelease -Dorg.gradle.daemon=false
          cp dist/dex/release/classes.dex "$release_dir/classes.dex"
          cp exteragram_plugin_template.py "$release_dir/exteragram-plugin-template.py"
          cd "$release_dir"
          zip -j "${PLUGIN_ID}.plugin" classes.dex exteragram-plugin-template.py
          cd -

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ runner.temp }}/release/${{ steps.plugin.outputs.id }}.plugin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Release v${{ inputs.version }} — ${{ steps.plugin.outputs.name }}
          files: |
            ${{ runner.temp }}/release/${{ steps.plugin.outputs.id }}.plugin
          draft: false
          prerelease: false
