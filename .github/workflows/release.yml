name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Point Gradle to runner Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Prepare Telegram Stub Jar
        run: |
          mkdir -p libs
          mkdir -p org/telegram/ui/ActionBar
          echo "package org.telegram.ui.ActionBar; public class ActionBar {}" > org/telegram/ui/ActionBar/ActionBar.java
          javac org/telegram/ui/ActionBar/ActionBar.java
          jar cf libs/Telegram.stripped.jar org/telegram/ui/ActionBar/ActionBar.class
          rm -rf org

      - name: Build DEX and Create Plugin
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
          VERSION: ${{ inputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew :buildDexRelease -Dorg.gradle.daemon=false
          
          python3 << 'PYEOF'
          import base64, lzma, sys, os

          print("Reading compiled DEX...")
          with open('dist/dex/release/classes.dex', 'rb') as f:
              dex_data = f.read()
          print("DEX size: " + str(len(dex_data)) + " bytes")

          print("Compressing and encoding DEX...")
          compressed = lzma.compress(dex_data)
          b64_data = base64.b64encode(compressed).decode('ascii')
          lines = []
          i = 0
          while i < len(b64_data):
              lines.append('# ' + b64_data[i:i+76])
              i += 76
          dex_text = '\n'.join(lines)

          print("Reading plugin template...")
          with open('solid_actionbar.py', 'r', encoding='utf-8') as f:
              content = f.read()

          version = os.environ.get('VERSION', '1.0.0')
          content = content.replace('PLACEHOLDER_VERSION', version)
          content = content.replace('PLACEHOLDER_DEX', dex_text)

          print("Writing final plugin file...")
          with open('solid_actionbar_final.py', 'w', encoding='utf-8') as f:
              f.write(content)
          print("Plugin file created successfully!")

          release_dir = os.environ.get('RUNNER_TEMP', '/tmp') + '/release'
          os.makedirs(release_dir, exist_ok=True)

          import shutil
          shutil.copy('solid_actionbar_final.py', os.path.join(release_dir, 'solid_actionbar.py'))

          print("Creating plugin archive...")
          os.chdir(release_dir)
          os.system('zip -j solid_actionbar.plugin solid_actionbar.py')
          os.chdir('/home/runner/work/solid-bar/solid-bar')

          print("Archive contents:")
          os.system('unzip -l ' + os.path.join(release_dir, 'solid_actionbar.plugin'))
          print("Archive size:")
          os.system('ls -lh ' + os.path.join(release_dir, 'solid_actionbar.plugin'))
          PYEOF

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/release/solid_actionbar.plugin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Release v${{ inputs.version }}
          files: ${{ runner.temp }}/release/solid_actionbar.plugin
          draft: false
          prerelease: false
