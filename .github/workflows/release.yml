name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AUTO_VERSION: "1.4.${{ github.run_number }}"
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Point Gradle to runner Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Prepare Telegram Stub Jar
        run: |
          mkdir -p libs
          mkdir -p org/telegram/ui/ActionBar
          echo "package org.telegram.ui.ActionBar; public class ActionBar {}" > org/telegram/ui/ActionBar/ActionBar.java
          javac org/telegram/ui/ActionBar/ActionBar.java
          jar cf libs/Telegram.stripped.jar org/telegram/ui/ActionBar/ActionBar.class
          rm -rf org

      - name: Build DEX
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          chmod +x gradlew
          ./gradlew :buildDexRelease -Dorg.gradle.daemon=false

      - name: Create Plugin
        env:
          VERSION: ${{ env.AUTO_VERSION }}
        run: |
          python3 build_plugin.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.AUTO_VERSION }}
          name: Release ${{ env.AUTO_VERSION }}
          files: ${{ runner.temp }}/release/solid_actionbar.plugin
          draft: false
          prerelease: false
