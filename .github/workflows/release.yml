name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Point Gradle to runner Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Prepare Telegram Stub Jar
        run: |
          mkdir -p libs
          echo "Creating fallback stub telegram.jar..."
          mkdir -p org/telegram/ui/ActionBar
          echo "package org.telegram.ui.ActionBar; public class ActionBar {}" > org/telegram/ui/ActionBar/ActionBar.java
          javac org/telegram/ui/ActionBar/ActionBar.java
          jar cf libs/Telegram.stripped.jar org/telegram/ui/ActionBar/ActionBar.class
          rm -rf org

      - name: Build DEX and Create Plugin
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
          VERSION: ${{ inputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew :buildDexRelease -Dorg.gradle.daemon=false
          
          python3 << 'PYEOF'
          import base64, lzma, sys, os

          # 1. Читаем скомпилированный DEX
          print("Reading compiled DEX...")
          with open('dist/dex/release/classes.dex', 'rb') as f:
              dex_data = f.read()
          print(f"DEX size: {len(dex_data)} bytes")

          # 2. Сжимаем и кодируем DEX
          print("Compressing and encoding DEX...")
          compressed = lzma.compress(dex_data)
          b64_data = base64.b64encode(compressed).decode('ascii')
          lines = ['# ' + b64_data[i:i+76] for i in range(0, len(b64_data), 76)]
          dex_text = '\n'.join(lines)

          # 3. Создаём минимальный Python-файл с нуля (только ASCII!)
          print("Creating clean Python plugin file...")
          version = os.environ.get('VERSION', '1.0.0')
          
          plugin_code = f'''# fmt: off
import base64
import lzma
import os
import threading
import traceback
from typing import Any, Optional, cast
from android.util import Log
from android.webkit import ValueCallback
from android_utils import copy_to_clipboard, run_on_ui_thread
from base_plugin import BasePlugin, MenuItemData, MenuItemType
from client_utils import get_last_fragment
from dalvik.system import InMemoryDexClassLoader
from java import dynamic_proxy
from java.lang import Class, Long, String
from java.nio import ByteBuffer
from org.telegram.messenger import ApplicationLoader, LocaleController
from org.telegram.ui.ActionBar import AlertDialog
from ui.bulletin import BulletinHelper
from ui.settings import Header, Text

__id__ = "solid_actionbar"
__name__ = "Solid Interface"
__version__ = "{version}"
__author__ = "Fill1357"
__description__ = "Disables blur and liquid glass globally"
__min_version__ = "12.1.1"

LOGCAT_TAG = __id__
JVM_PLUGIN_CLASS = "ru.n08i40k.template.Plugin"

# === EMDEDDED DEX BEGIN ===
{dex_text}
# === EMDEDDED DEX END ===

I18N_SETTINGS = {{"settings.example.title": {{"en": "Example", "ru": "Example"}}}}
I18N_MENU = {{"menu.chat.example.title": {{"en": "Example", "ru": "Example"}}}}
I18N_DIALOG = {{"dialog.load_crash.title": {{"en": "Failed", "ru": "Failed"}}}}
I18N_STATUS = {{"status.error.dex.missing": {{"en": "Missing", "ru": "Missing"}}}}
I18N_STRINGS = {{}}
I18N_STRINGS.update(I18N_SETTINGS)
I18N_STRINGS.update(I18N_MENU)
I18N_STRINGS.update(I18N_DIALOG)
I18N_STRINGS.update(I18N_STATUS)

def _as_dialog_id(value):
    try:
        return int(value) or None
    except Exception:
        return None

def _dialog_id_of(obj):
    try:
        return _as_dialog_id(obj.getDialogId())
    except Exception:
        return None

class JvmPluginBridge:
    klass = None
    def __init__(self, plugin):
        self.plugin = plugin
        self.klass = None
    def load(self):
        dex_data = self._read_embedded_dex()
        if dex_data is None:
            self.plugin.log("Embedded DEX is unavailable")
            self.plugin._show_error(self.plugin._t("status.error.dex.missing"))
            return
        try:
            loader = InMemoryDexClassLoader(ByteBuffer.wrap(dex_data), ApplicationLoader.applicationContext.getClassLoader())
            self.klass = loader.loadClass(String(JVM_PLUGIN_CLASS))
        except Exception as e:
            self.plugin.log_exception("Failed to load DEX", e)
    def call(self, name, *args, **kwargs):
        types = kwargs.get('types', ())
        if self.klass is None:
            raise RuntimeError(f"cannot call {{name}}: JVM plugin is not loaded")
        return self.klass.getDeclaredMethod(String(name), *types).invoke(None, *args)
    def _read_own_source(self):
        candidates = []
        own_file = globals().get("__file__")
        if isinstance(own_file, str) and own_file:
            candidates.append(own_file)
        plugins_dir_getter = globals().get("get_plugins_dir")
        if callable(plugins_dir_getter):
            try:
                candidates.append(os.path.join(plugins_dir_getter(), f"{{__id__}}.py"))
            except Exception as e:
                self.plugin.log_exception("Failed to resolve plugins directory", e)
        for path in candidates:
            try:
                with open(path, "r", encoding="utf-8") as f:
                    return f.read()
            except Exception as e:
                self.plugin.log_exception(f"Failed to read plugin source at {{path}}", e)
        return None
    def _read_embedded_dex(self):
        source = self._read_own_source()
        if source is None:
            self.plugin.log("Failed to read plugin source for embedded DEX")
            return None
        payload = bytearray()
        decompressor = lzma.LZMADecompressor()
        collecting = False
        completed = False
        try:
            for line in source.splitlines():
                stripped = line.strip()
                if not collecting:
                    collecting = stripped == "# === EMDEDDED DEX BEGIN ==="
                    continue
                if stripped == "# === EMDEDDED DEX END ===":
                    completed = True
                    break
                if stripped.startswith("#"):
                    chunk = base64.b64decode(stripped[1:].strip())
                    payload += decompressor.decompress(chunk)
        except (ValueError, lzma.LZMAError) as e:
            self.plugin.log_exception("Failed to decode embedded DEX", e)
            return None
        if completed and not decompressor.eof:
            self.plugin.log("Embedded DEX payload is truncated")
            return None
        if not completed or not payload:
            self.plugin.log("Embedded DEX payload is empty")
            return None
        return bytes(payload)

class ChatContextMenu:
    EXAMPLE = "example"
    MENU_ITEMS = ({{"key": EXAMPLE, "text_key": "menu.chat.example.title", "subtext_key": "menu.chat.example.description", "icon": "msg_settings", "priority": 1000}},)
    PAYLOAD_DIALOG_KEYS = ("dialog_id", "dialogId")
    PAYLOAD_FRAGMENT_KEYS = ("chatActivity", "fragment")
    def __init__(self, plugin):
        self.plugin = plugin
        self._item_ids = {{}}
    def register(self):
        self.unregister()
        for item in self.MENU_ITEMS:
            key = item["key"]
            try:
                item_id = self.plugin.add_menu_item(MenuItemData(menu_type=MenuItemType.CHAT_ACTION_MENU, text=self.plugin._t(item["text_key"]), subtext=self.plugin._t(item["subtext_key"]), icon=item["icon"], on_click=lambda payload, button=key: self._on_click(button, payload), priority=item["priority"]))
                self._item_ids[key] = str(item_id)
            except Exception as e:
                self.plugin.log_exception(f"Failed to register chat context menu item {{key}}", e)
    def unregister(self):
        for key, item_id in tuple(self._item_ids.items()):
            try:
                self.plugin.remove_menu_item(item_id)
            except Exception as e:
                self.plugin.log_exception(f"Failed to remove chat context menu item {{key}}", e)
        self._item_ids.clear()
    def _on_click(self, key, payload):
        dialog_id = self._extract_dialog_id(payload)
        if dialog_id is None:
            self.plugin.log(f"Chat context menu click payload missing dialog id for {{key}}")
            self.plugin._show_error(self.plugin._t("status.error.chat.detect_current_failed"))
            return
        try:
            self.plugin.jvm_plugin.call("invokeChatContextMenuCallback", String(key), Long(dialog_id), types=(String.getClass(), Long.TYPE))
        except Exception as e:
            self.plugin.log_exception(f"Failed to execute chat context menu callback {{key}}", e)
    def _extract_dialog_id(self, payload):
        getter = getattr(payload, "get", None)
        if getter is None:
            return _dialog_id_of(payload)
        for key in self.PAYLOAD_DIALOG_KEYS:
            dialog_id = _as_dialog_id(getter(key))
            if dialog_id is not None:
                return dialog_id
        for key in self.PAYLOAD_FRAGMENT_KEYS:
            dialog_id = _dialog_id_of(getter(key))
            if dialog_id is not None:
                return dialog_id
        return _dialog_id_of(payload)

class SettingsActions:
    EXAMPLE = "example"
    def __init__(self, plugin):
        self.plugin = plugin
    def build_settings(self):
        return [Header(text=self.plugin._t("settings.example.title")), Text(text=self.plugin._t("settings.example.title"), icon="msg_settings", on_click=lambda _: self._on_click(self.EXAMPLE))]
    def _on_click(self, key):
        try:
            self.plugin.jvm_plugin.call("invokeSettingsActionCallback", String(key), types=(String.getClass(),))
        except Exception as e:
            self.plugin.log_exception(f"Failed to execute settings callback {{key}}", e)

class TemplatePlugin(BasePlugin):
    _full_load_lock = threading.Lock()
    _eject_lock = threading.Lock()
    _load_logging_active = False
    _load_log_buffer = []
    _full_load_started = False
    _ejected = False
    jvm_plugin = None
    chat_context_menu = None
    def log(self, message):
        text = str(message)
        super().log(text)
        if self._load_logging_active:
            self._load_log_buffer.append(text)
        try:
            Log.i(cast("String", LOGCAT_TAG), cast("String", text))
        except Exception:
            pass
    def log_exception(self, message, exception):
        self.log(f"{{message}}: {{exception}}")
        for chunk in traceback.format_exception(type(exception), exception, exception.__traceback__):
            for line in chunk.rstrip().splitlines():
                if line:
                    self.log(line)
    def create_settings(self):
        return SettingsActions(self).build_settings()
    def _show_error(self, message):
        run_on_ui_thread(lambda: BulletinHelper.show_error(message))
    def _t(self, key, **kwargs):
        values = I18N_STRINGS.get(key)
        if values is None:
            text = key
        else:
            text = values.get(self._get_app_language_code()) or values.get("en") or key
        try:
            return text.format(**kwargs)
        except Exception:
            return text
    def _get_app_language_code(self):
        raw = None
        try:
            info = LocaleController.getInstance().getCurrentLocaleInfo()
            if info.hasBaseLang():
                raw = info.baseLangCode
            else:
                raw = info.getLangCode() or info.shortName
        except Exception:
            pass
        if not raw:
            try:
                raw = LocaleController.getInstance().getCurrentLocale().getLanguage()
            except Exception:
                return "en"
        return str(raw).strip().lower().replace("-", "_").split("_", 1)[0] or "en"
    def _start_load_logging(self):
        self._load_log_buffer = []
        self._load_logging_active = True
    def _stop_load_logging(self):
        self._load_logging_active = False
        self._load_log_buffer = []
    def _handle_load_failure(self, stage, exception):
        self.log_exception(f"Plugin load failed ({{stage}})", exception)
        logs = "\\n".join(self._load_log_buffer)
        report = f"Stage: `{{stage}}`\\nPlugin version: `{{__version__}}`\\n\\nError:\\n```\\n{{exception}}\\n```\\n\\nLog:\\n```\\n{{logs}}\\n```"
        try:
            copy_to_clipboard(report)
        except Exception as e:
            self.log_exception("Failed to copy load-crash report to clipboard", e)
        self._show_load_crash_dialog(stage)
    def _show_load_crash_dialog(self, stage):
        def show():
            try:
                fragment = get_last_fragment()
            except Exception:
                fragment = None
            message = self._t("dialog.load_crash.message", stage=stage)
            if fragment is None:
                self._show_error(message)
                return
            try:
                fragment.showDialog(AlertDialog.Builder(fragment.getContext()).setTitle(String(self._t("dialog.load_crash.title"))).setMessage(String(message)).setPositiveButton(String(self._t("dialog.load_crash.ok")), None).create())
            except Exception as e:
                self.log_exception("Failed to show load crash dialog", e)
                self._show_error(message)
        run_on_ui_thread(show)
    def _prepare_jvm_plugin(self):
        self.jvm_plugin = JvmPluginBridge(self)
        self.jvm_plugin.load()
        return self.jvm_plugin.klass is not None
    def _inject_jvm_plugin(self):
        try:
            self.log(f"Loading JVM plugin {{self.jvm_plugin.call('getBuildDate')}}")
        except Exception as e:
            self.log_exception("Failed to infer JVM plugin version", e)
        ref = self
        class Logger(dynamic_proxy(ValueCallback)):
            def onReceiveValue(self, arg0):
                ref.log(str(arg0))
        self.jvm_plugin.call("inject", String(__version__), Logger(), types=(String.getClass(), ValueCallback.getClass()))
        self.log("JVM plugin injected successfully")
    def _register_ui(self):
        self.chat_context_menu = ChatContextMenu(self)
        self.chat_context_menu.register()
    def _finalize_jvm_plugin_inject(self):
        self.jvm_plugin.call("finalizeInject")
        self.log("JVM plugin finalizeInject completed")
    def _run_plugin_load(self):
        with self._full_load_lock:
            if self._full_load_started:
                return
            self._full_load_started = True
            if not self._prepare_jvm_plugin():
                with self._full_load_lock:
                    self._full_load_started = False
                return
            for stage, action in (("inject", self._inject_jvm_plugin), ("register ui", self._register_ui), ("finalizeInject", self._finalize_jvm_plugin_inject)):
                try:
                    action()
                except BaseException as e:
                    self._handle_load_failure(stage, e)
                    self.on_plugin_eject()
                    return
            self._stop_load_logging()
    def _unregister_chat_context_menu(self, reason):
        if self.chat_context_menu is None:
            return
        try:
            self.chat_context_menu.unregister()
        except Exception as e:
            self.log_exception(f"Failed to unregister chat context menu ({{reason}})", e)
    def on_plugin_load(self):
        self._start_load_logging()
        self._ejected = False
        self._full_load_started = False
        thread = threading.Thread(target=self._run_plugin_load, name=f"{{__id__}}-continue-plugin-load", daemon=True)
        thread.start()
        return thread
    def on_plugin_unload(self):
        jvm_plugin = getattr(self, "jvm_plugin", None)
        if jvm_plugin is None or jvm_plugin.klass is None:
            return
        self._unregister_chat_context_menu("unload")
        try:
            jvm_plugin.call("eject")
            self.log("JVM plugin ejected successfully")
        except Exception as e:
            self.log_exception("Failed to eject JVM plugin", e)
        jvm_plugin.klass = None
    def on_plugin_eject(self):
        with self._eject_lock:
            if self._ejected:
                return
            self._ejected = True
            self.log("JVM plugin instance lost: ejected by a concurrent reload")
            self._unregister_chat_context_menu("eject")
            jvm_plugin = getattr(self, "jvm_plugin", None)
            if jvm_plugin is not None:
                jvm_plugin.klass = None
'''
          
          # 4. Сохраняем файл
          with open('solid_actionbar.py', 'w', encoding='ascii') as f:
              f.write(plugin_code)
          print('✅ Plugin file created successfully!')
          
          # 5. Упаковываем в .plugin
          release_dir="$RUNNER_TEMP/release"
          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          
          cp solid_actionbar.py "$release_dir/solid_actionbar.py"
          
          cd "$release_dir"
          zip -j "solid_actionbar.plugin" solid_actionbar.py
          cd -
          
          echo "=== ARCHIVE CONTENTS ==="
          unzip -l "$release_dir/solid_actionbar.plugin"
          ls -lh "$release_dir/solid_actionbar.plugin"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ runner.temp }}/release/solid_actionbar.plugin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Release v${{ inputs.version }} — Solid Interface
          files: |
            ${{ runner.temp }}/release/solid_actionbar.plugin
          draft: false
          prerelease: false
